<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络传输全链路解析 | 教学演示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>
    <style>
        .tech-font { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', Courier, monospace; }
        .blueprint-grid {
            background-color: #0f172a;
            background-image: linear-gradient(rgba(51, 65, 85, 0.4) 1px, transparent 1px),
            linear-gradient(90deg, rgba(51, 65, 85, 0.4) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 overflow-hidden">
    <div id="root" class="h-screen w-screen"></div>

    <script type="text/babel" data-presets="react" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { ChevronRight, ChevronLeft, Laptop, Network, Server, Globe, Database, ServerCog, MessageSquare, Video, Play, Pause, RotateCcw, AlertTriangle, Search, Link, MessageCircle, Film, FileCode2, Mail } from 'lucide-react';

        // ------------------ SVGs for Professional Networking Icons (Scene 4) ------------------
        const NetworkIcons = {
            Router: () => (
                <svg viewBox="0 0 64 64" width="48" height="48">
                    <circle cx="32" cy="32" r="28" fill="#1e293b" stroke="#3b82f6" strokeWidth="3" />
                    <path d="M32 14v36M14 32h36" stroke="#3b82f6" strokeWidth="3" />
                    <path d="M28 18l4-4 4 4M28 46l4 4 4-4M18 28l-4 4 4 4M46 28l4 4-4 4" stroke="#3b82f6" strokeWidth="2" fill="none" />
                </svg>
            ),
            Switch: () => (
                <svg viewBox="0 0 64 64" width="48" height="48">
                    <rect x="8" y="16" width="48" height="32" rx="4" fill="#1e293b" stroke="#22c55e" strokeWidth="3" />
                    <path d="M16 26h32M16 38h32" stroke="#22c55e" strokeWidth="2" />
                    <path d="M44 22l4 4-4 4M20 34l-4 4 4 4" stroke="#22c55e" strokeWidth="2" fill="none" />
                </svg>
            ),
            PC: () => (
                <svg viewBox="0 0 64 64" width="44" height="44">
                    <rect x="12" y="14" width="40" height="26" rx="2" fill="#1e293b" stroke="#94a3b8" strokeWidth="3" />
                    <path d="M28 40v8h8v-8M20 48h24" stroke="#94a3b8" strokeWidth="3" fill="none" />
                    <line x1="16" y1="34" x2="48" y2="34" stroke="#94a3b8" strokeWidth="1" />
                </svg>
            ),
            Server: () => (
                <svg viewBox="0 0 64 64" width="36" height="48">
                    <rect x="14" y="8" width="36" height="48" rx="2" fill="#1e293b" stroke="#cbd5e1" strokeWidth="3" />
                    <line x1="20" y1="16" x2="44" y2="16" stroke="#cbd5e1" strokeWidth="2" />
                    <line x1="20" y1="26" x2="44" y2="26" stroke="#cbd5e1" strokeWidth="2" />
                    <line x1="20" y1="36" x2="44" y2="36" stroke="#cbd5e1" strokeWidth="2" />
                    <circle cx="20" cy="46" r="2" fill="#cbd5e1" />
                </svg>
            ),
            Cloud: () => (
                <svg viewBox="0 0 64 64" width="60" height="40">
                    <path d="M18 40a12 12 0 010-24 14 14 0 0126-4 10 10 0 014 18h-30z" fill="#1e293b" stroke="#64748b" strokeWidth="3" />
                </svg>
            )
        };

        // ------------------ Data Models ------------------
        const NODES = {
            pc: { id: 'pc', name: 'User PC', proName: 'Workstation', x: 10, y: 50, icon: Laptop, proIcon: 'PC', ip: '192.168.1.100', mac: 'AA:AA', iface: 'eth0' },
            switch: { id: 'switch', name: '局域网交换机', proName: 'Access_Switch', x: 25, y: 50, icon: Network, proIcon: 'Switch', ip: 'N/A', mac: 'N/A', ifaces: { left: 'Fa0/1', right: 'Fa0/24' } },
            router: { id: 'router', name: '网关路由器', proName: 'Edge_Router', x: 40, y: 50, icon: Server, proIcon: 'Router', ip: '192.168.1.1', mac: 'BB:BB', publicIp: '203.0.113.1', publicMac: 'CC:CC', ifaces: { left: 'Gi0/0', right: 'Se0/0/0' } },
            internet: { id: 'internet', name: '公网核心路由', proName: 'Internet_Backbone', x: 60, y: 50, icon: Globe, proIcon: 'Cloud', ip: 'N/A', mac: 'N/A' },
            dns: { id: 'dns', name: 'DNS 服务器', proName: 'DNS_Cluster', x: 85, y: 15, icon: Database, proIcon: 'Server', ip: '8.8.8.8', mac: 'DD:DD', iface: 'eth0' },
            web: { id: 'web', name: 'Web 服务器', proName: 'Web_Server', x: 85, y: 40, icon: ServerCog, proIcon: 'Server', ip: '198.51.100.10', mac: 'EE:EE', iface: 'eth0' },
            chat: { id: 'chat', name: 'IM 服务器', proName: 'IM_Gateway', x: 85, y: 65, icon: MessageSquare, proIcon: 'Server', ip: '198.51.100.20', mac: 'FF:FF', iface: 'eth0' },
            cdn: { id: 'cdn', name: 'CDN 边缘节点', proName: 'CDN_Edge', x: 70, y: 85, icon: Video, proIcon: 'Server', ip: '203.0.113.200', mac: 'GG:GG', iface: 'eth0' },
        };

        const EDGES = [
            ['pc', 'switch'], ['switch', 'router'], ['router', 'internet'],
            ['internet', 'dns'], ['internet', 'web'], ['internet', 'chat'], ['internet', 'cdn']
        ];

        // 保留通俗易懂的对话载荷 (Scene 1-3)
        const SCENARIOS = {
            web: {
                title: "Web 网页请求全链路",
                desc: "从敲击回车到页面渲染，体验完整的 DNS 寻址、TCP 握手与 HTTP 交互。注意观察数据包穿越路由器时 MAC 地址的变化。",
                steps: [
                    { name: "1. DNS 查询", route: ['pc', 'switch', 'router', 'internet', 'dns'], target: 'dns', proto: 'UDP 53', payload: '❓ "请问 www.example.com 的门牌号(IP)是多少？"', color: 'bg-emerald-600' },
                    { name: "2. DNS 响应", route: ['dns', 'internet', 'router', 'switch', 'pc'], target: 'pc', proto: 'UDP', payload: '💡 "查到了，它的门牌号是 198.51.100.10"', color: 'bg-emerald-600' },
                    { name: "3. TCP 握手一 (SYN)", route: ['pc', 'switch', 'router', 'internet', 'web'], target: 'web', proto: 'TCP 80', payload: '🤝 [SYN] "你好服务器，我要看网页，能建立连接吗？"', color: 'bg-yellow-600' },
                    { name: "4. TCP 握手二 (SYN-ACK)", route: ['web', 'internet', 'router', 'switch', 'pc'], target: 'pc', proto: 'TCP', payload: '🤝 [SYN-ACK] "可以的，我准备好了！你呢？"', color: 'bg-yellow-600' },
                    { name: "5. TCP 握手三 (ACK)", route: ['pc', 'switch', 'router', 'internet', 'web'], target: 'web', proto: 'TCP 80', payload: '🤝 [ACK] "收到，连接正式建立！我要发数据了。"', color: 'bg-yellow-600' },
                    { name: "6. HTTP 请求 (GET)", route: ['pc', 'switch', 'router', 'internet', 'web'], target: 'web', proto: 'TCP 80', payload: '📄 [GET] "请把主页的 HTML 网页文件传给我！"', color: 'bg-blue-600' },
                    { name: "7. HTTP 响应 (OK)", route: ['web', 'internet', 'router', 'switch', 'pc'], target: 'pc', proto: 'TCP', payload: '🎉 [200 OK] "没问题，网页数据来了: <html>...</html>"', color: 'bg-blue-600' }
                ]
            },
            im: {
                title: "IM 聊天全链路",
                desc: "剥离 DNS 和握手开销，直接利用已有长连接或 UDP 推送，体验极低的延迟和极轻的载荷。",
                steps: [
                    { name: "1. 发送消息", route: ['pc', 'switch', 'router', 'internet', 'chat'], target: 'chat', proto: 'UDP 9999', payload: '💬 [无握手直飞] "在吗？" (极轻量载荷)', color: 'bg-pink-600' },
                    { name: "2. 服务器确认", route: ['chat', 'internet', 'router', 'switch', 'pc'], target: 'pc', proto: 'UDP', payload: '✅ "滴！服务器已收到消息。"', color: 'bg-pink-600' }
                ]
            },
            video: {
                title: "视频播放全链路",
                desc: "智能 DNS 调度将流量引导至物理距离最近的 CDN 节点，并通过缓冲池机制抵抗网络抖动。",
                steps: [
                    { name: "1. 智能 DNS 查询", route: ['pc', 'switch', 'router', 'internet', 'dns'], target: 'dns', proto: 'UDP 53', payload: '❓ "请问视频网站 v.example.com 怎么走？"', color: 'bg-emerald-600' },
                    { name: "2. DNS 智能调度", route: ['dns', 'internet', 'router', 'switch', 'pc'], target: 'pc', proto: 'UDP', payload: '🚀 "为防卡顿，分配最近 CDN 节点: 203.0.113.200"', color: 'bg-emerald-600' },
                    { name: "3. TCP 建连", route: ['pc', 'switch', 'router', 'internet', 'cdn'], target: 'cdn', proto: 'TCP 443', payload: '🤝 [SYN] "CDN节点你好，我要开始拉取视频了！"', color: 'bg-yellow-600' },
                    { name: "4. 流数据块 1", route: ['cdn', 'internet', 'router', 'switch', 'pc'], target: 'pc', proto: 'TCP', payload: '🎬 "高清画面第1秒... (持续传送中)"', color: 'bg-indigo-600' },
                    { name: "5. 流数据块 2", route: ['cdn', 'internet', 'router', 'switch', 'pc'], target: 'pc', proto: 'TCP', payload: '🎬 "高清画面第2秒... (本地水池正在蓄水)"', color: 'bg-indigo-600' },
                    { name: "6. 流数据块 3", route: ['cdn', 'internet', 'router', 'switch', 'pc'], target: 'pc', proto: 'TCP', payload: '🎬 "高清画面第3秒... (水池已满，开始播放！)"', color: 'bg-indigo-600' }
                ]
            }
        };

        // ------------------ Components ------------------

        // Scene 1-3 使用的基础卡通节点
        const NodeObj = ({ node }) => {
            const Icon = node.icon;
            return (
                <div 
                    className="absolute transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-1 z-10"
                    style={{ left: `${node.x}%`, top: `${node.y}%` }}
                >
                    <div className="w-12 h-12 bg-slate-800 border-2 border-slate-600 rounded-lg flex items-center justify-center shadow-lg">
                        <Icon size={24} className="text-slate-300" />
                    </div>
                    <div className="text-xs font-semibold whitespace-nowrap text-slate-300 bg-slate-900/80 px-2 py-0.5 rounded">
                        {node.name}
                    </div>
                </div>
            );
        };

        // Scene 4 使用的专业节点
        const ProNodeObj = ({ node }) => {
            const IconComp = NetworkIcons[node.proIcon];
            return (
                <div 
                    className="absolute transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center z-20"
                    style={{ left: `${node.x}%`, top: '18%' }}
                >
                    <div className="bg-slate-900 border border-slate-700 p-2"><IconComp /></div>
                    {/* Device Meta Text */}
                    <div className="mt-1 text-center font-mono text-[11px] bg-slate-900 px-1 border border-slate-700">
                        {node.proName}
                    </div>
                    {node.ifaces?.left && <div className="absolute text-[9px] font-mono text-slate-400 top-1/2 -translate-y-1/2 -left-8 bg-slate-900 px-1 border border-slate-700 rounded-sm">{node.ifaces.left}</div>}
                    {node.ifaces?.right && <div className="absolute text-[9px] font-mono text-slate-400 top-1/2 -translate-y-1/2 -right-8 bg-slate-900 px-1 border border-slate-700 rounded-sm">{node.ifaces.right}</div>}
                    {node.iface && <div className="absolute text-[9px] font-mono text-slate-400 -left-8 top-1/2 -translate-y-1/2 bg-slate-900 px-1 border border-slate-700 rounded-sm">{node.iface}</div>}
                </div>
            );
        };

        const StackBox = ({ layer, proto, active, colorHex }) => {
            const bgStr = active ? 'bg-slate-800 text-slate-100' : 'bg-slate-900/50 text-slate-500';
            const borderStr = active ? `border-l-[3px]` : 'border border-slate-700';
            return (
                <div 
                    className={`w-32 text-center text-[10px] font-mono py-1 my-[2px] ${bgStr} ${borderStr}`}
                    style={active ? { borderLeftColor: colorHex, borderTop: '1px solid #334155', borderRight: '1px solid #334155', borderBottom: '1px solid #334155' } : {}}
                >
                    <div className="font-bold">{layer}</div>
                    <div className="opacity-80">{proto}</div>
                </div>
            );
        };

        // OSI 协议栈映射组件 (Scene 4)
        const ProtocolSummary = () => {
            const SUMMARY_NODES = [NODES.pc, NODES.switch, NODES.router, NODES.web];
            const stackBaseY = 170; 
            const layerH = 40; 
            
            return (
                <div className="flex flex-col h-full gap-4 tech-font">
                    <div className="bg-[#0f172a] p-4 rounded-sm border border-slate-700 flex justify-between items-start font-sans">
                        <div>
                            <h2 className="text-xl font-bold text-white mb-2">Network Architecture & OSI Encapsulation Model</h2>
                            <p className="text-slate-400 text-sm max-w-4xl">
                                展示协议栈封装在网络设备间的物理映射。L7/L4 建立端到端（End-to-End）逻辑通信；L3 执行跨网段路由（Routing）；L2 负责物理介质上的逐跳帧转发（Hop-by-Hop Switching）。
                            </p>
                        </div>
                    </div>

                    <div className="flex-1 relative blueprint-grid border border-slate-700 overflow-hidden flex flex-col">
                        <div className="relative flex-1 min-h-[450px]">
                            <svg className="absolute inset-0 w-full h-full pointer-events-none z-0">
                                <line x1={`${NODES.pc.x}%`} y1="18%" x2={`${NODES.switch.x}%`} y2="18%" stroke="#64748b" strokeWidth="2" />
                                <line x1={`${NODES.switch.x}%`} y1="18%" x2={`${NODES.router.x}%`} y2="18%" stroke="#64748b" strokeWidth="2" />
                                <line x1={`${NODES.router.x}%`} y1="18%" x2={`${NODES.web.x}%`} y2="18%" stroke="#64748b" strokeWidth="2" />
                                <path d={`M ${NODES.router.x+10}% 18% Q ${NODES.router.x+20}% 10%, ${NODES.web.x-10}% 18%`} stroke="#64748b" strokeWidth="1" strokeDasharray="4,4" fill="none" />
                                
                                <line x1={`${NODES.pc.x + 6}%`} y1={`${stackBaseY + layerH * 0.5}px`} x2={`${NODES.web.x - 6}%`} y2={`${stackBaseY + layerH * 0.5}px`} stroke="#a855f7" strokeWidth="2" strokeDasharray="4,4" />
                                <line x1={`${NODES.pc.x + 6}%`} y1={`${stackBaseY + layerH * 1.5}px`} x2={`${NODES.web.x - 6}%`} y2={`${stackBaseY + layerH * 1.5}px`} stroke="#eab308" strokeWidth="2" strokeDasharray="4,4" />
                                <line x1={`${NODES.pc.x + 6}%`} y1={`${stackBaseY + layerH * 2.5}px`} x2={`${NODES.router.x - 6}%`} y2={`${stackBaseY + layerH * 2.5}px`} stroke="#3b82f6" strokeWidth="2" />
                                <line x1={`${NODES.router.x + 6}%`} y1={`${stackBaseY + layerH * 2.5}px`} x2={`${NODES.web.x - 6}%`} y2={`${stackBaseY + layerH * 2.5}px`} stroke="#3b82f6" strokeWidth="2" />
                                <line x1={`${NODES.pc.x + 6}%`} y1={`${stackBaseY + layerH * 3.5}px`} x2={`${NODES.switch.x - 6}%`} y2={`${stackBaseY + layerH * 3.5}px`} stroke="#22c55e" strokeWidth="2" />
                                <line x1={`${NODES.switch.x + 6}%`} y1={`${stackBaseY + layerH * 3.5}px`} x2={`${NODES.router.x - 6}%`} y2={`${stackBaseY + layerH * 3.5}px`} stroke="#22c55e" strokeWidth="2" />
                                <line x1={`${NODES.router.x + 6}%`} y1={`${stackBaseY + layerH * 3.5}px`} x2={`${NODES.web.x - 6}%`} y2={`${stackBaseY + layerH * 3.5}px`} stroke="#22c55e" strokeWidth="2" strokeDasharray="2,2" />
                            </svg>

                            {SUMMARY_NODES.map(node => <ProNodeObj key={node.id} node={node} />)}

                            <div className="absolute flex flex-col z-10" style={{ left: `${NODES.pc.x}%`, transform: 'translateX(-50%)', top: `${stackBaseY}px` }}>
                                <StackBox layer="L7 Application" proto="HTTP/DNS" active colorHex="#a855f7" />
                                <StackBox layer="L4 Transport" proto="TCP/UDP" active colorHex="#eab308" />
                                <StackBox layer="L3 Network" proto="IPv4" active colorHex="#3b82f6" />
                                <StackBox layer="L2 Data Link" proto="802.3 MAC" active colorHex="#22c55e" />
                                <StackBox layer="L1 Physical" proto="1000BASE-T" active colorHex="#94a3b8" />
                            </div>

                            <div className="absolute flex flex-col z-10" style={{ left: `${NODES.switch.x}%`, transform: 'translateX(-50%)', top: `${stackBaseY + layerH * 3}px` }}>
                                <StackBox layer="L2 Data Link" proto="MAC Forwarding" active colorHex="#22c55e" />
                                <StackBox layer="L1 Physical" proto="1000BASE-T" active colorHex="#94a3b8" />
                            </div>

                            <div className="absolute flex flex-col z-10" style={{ left: `${NODES.router.x}%`, transform: 'translateX(-50%)', top: `${stackBaseY + layerH * 2}px` }}>
                                <StackBox layer="L3 Network" proto="IP Routing" active colorHex="#3b82f6" />
                                <StackBox layer="L2 Data Link" proto="802.3 MAC" active colorHex="#22c55e" />
                                <StackBox layer="L1 Physical" proto="1000BASE-T" active colorHex="#94a3b8" />
                            </div>

                            <div className="absolute flex flex-col z-10" style={{ left: `${NODES.web.x}%`, transform: 'translateX(-50%)', top: `${stackBaseY}px` }}>
                                <StackBox layer="L7 Application" proto="Nginx/Web" active colorHex="#a855f7" />
                                <StackBox layer="L4 Transport" proto="TCP/UDP" active colorHex="#eab308" />
                                <StackBox layer="L3 Network" proto="IPv4" active colorHex="#3b82f6" />
                                <StackBox layer="L2 Data Link" proto="802.3 MAC" active colorHex="#22c55e" />
                                <StackBox layer="L1 Physical" proto="1000BASE-T" active colorHex="#94a3b8" />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 动画演示组件 (Scene 1-3)
        const NetworkSimulator = ({ scenarioKey }) => {
            const scenario = SCENARIOS[scenarioKey];
            const [currentStepIdx, setCurrentStepIdx] = useState(0);
            const [currentNodeIdx, setCurrentNodeIdx] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [dnsOffline, setDnsOffline] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const currentStep = scenario.steps[currentStepIdx] || scenario.steps[0];
            const route = currentStep.route;
            const isMoving = isPlaying && !errorMsg;

            useEffect(() => {
                if (!isMoving) return;
                const isAtDns = route[currentNodeIdx] === 'dns';
                if (isAtDns && dnsOffline) {
                    setErrorMsg('DNS 服务器无响应，请求超时丢失。');
                    setIsPlaying(false);
                    return;
                }

                if (currentNodeIdx < route.length - 1) {
                    const timer = setTimeout(() => {
                        setCurrentNodeIdx(prev => prev + 1);
                    }, 800); 
                    return () => clearTimeout(timer);
                } else {
                    const timer = setTimeout(() => {
                        if (currentStepIdx < scenario.steps.length - 1) {
                            setCurrentStepIdx(prev => prev + 1);
                            setCurrentNodeIdx(0);
                        } else {
                            setIsPlaying(false); 
                        }
                    }, 1200); 
                    return () => clearTimeout(timer);
                }
            }, [currentNodeIdx, isPlaying, currentStepIdx, scenarioKey, dnsOffline, route, isMoving, scenario.steps.length]);

            const handlePlayPause = () => {
                if (errorMsg) {
                    setCurrentStepIdx(0);
                    setCurrentNodeIdx(0);
                    setErrorMsg('');
                }
                if (!isPlaying && currentStepIdx === scenario.steps.length - 1 && currentNodeIdx === route.length - 1) {
                    setCurrentStepIdx(0);
                    setCurrentNodeIdx(0);
                }
                setIsPlaying(!isPlaying);
            };

            const handleReset = () => {
                setCurrentStepIdx(0);
                setCurrentNodeIdx(0);
                setIsPlaying(false);
                setErrorMsg('');
            };

            const currentNode = NODES[route[currentNodeIdx]];
            const originNode = NODES[route[0]];
            const targetNode = NODES[route[route.length - 1]];
            
            let macSrc = 'N/A';
            let macDst = 'N/A';
            let ipSrc = originNode.ip || 'N/A';
            let ipDst = targetNode.ip || 'N/A';

            const isOutbound = route[0] === 'pc'; 
            if (isOutbound) {
                if (currentNode.x < NODES.router.x) { 
                    macSrc = NODES.pc.mac;
                    macDst = NODES.router.mac; 
                } else { 
                    macSrc = NODES.router.publicMac;
                    macDst = targetNode.mac || 'Internet_MAC'; 
                }
            } else { 
                if (currentNode.x > NODES.router.x) { 
                    macSrc = originNode.mac || 'Internet_MAC';
                    macDst = NODES.router.publicMac;
                } else { 
                    macSrc = NODES.router.mac;
                    macDst = NODES.pc.mac;
                }
            }

            let PacketIcon = Mail;
            if (currentStep.proto.includes('UDP 53')) PacketIcon = Search;
            else if (currentStep.proto.includes('SYN')) PacketIcon = Link;
            else if (scenarioKey === 'im') PacketIcon = MessageCircle;
            else if (scenarioKey === 'video') PacketIcon = Film;
            else if (currentStep.proto.includes('HTTP')) PacketIcon = FileCode2;

            return (
                <div className="flex flex-col h-full gap-4">
                    <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-start shadow-md">
                        <div>
                            <h2 className="text-xl font-bold text-white mb-2">{scenario.title}</h2>
                            <p className="text-slate-400 text-sm max-w-2xl">{scenario.desc}</p>
                        </div>
                        <div className="flex gap-2">
                            <button 
                                onClick={() => setDnsOffline(!dnsOffline)}
                                className={`px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 transition-colors ${dnsOffline ? 'bg-red-900/50 text-red-400 border border-red-500' : 'bg-slate-700 text-slate-300 border border-slate-600 hover:bg-slate-600'}`}
                            >
                                <AlertTriangle size={16} />
                                {dnsOffline ? 'DNS 已断开' : '正常网络'}
                            </button>
                            <button onClick={handleReset} className="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 transition-colors">
                                <RotateCcw size={20} />
                            </button>
                            <button onClick={handlePlayPause} className={`px-4 py-2 rounded-lg flex items-center gap-2 font-bold transition-colors ${isPlaying ? 'bg-amber-600 hover:bg-amber-500' : 'bg-blue-600 hover:bg-blue-500'}`}>
                                {isPlaying ? <Pause size={20} /> : <Play size={20} />}
                                {isPlaying ? '暂停' : '执行演示'}
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 relative bg-slate-900 border border-slate-700 rounded-xl overflow-hidden shadow-inner">
                        <div className="absolute inset-0 bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:20px_20px] opacity-30"></div>
                        
                        <svg className="absolute inset-0 w-full h-full pointer-events-none z-0">
                            {EDGES.map(([n1, n2], idx) => {
                                const node1 = NODES[n1];
                                const node2 = NODES[n2];
                                const isPublic = n1==='internet' || n2==='internet' || n1==='dns' || n2==='dns' || n1==='web' || n2==='web' || n1==='chat' || n2==='chat' || n1==='cdn' || n2==='cdn';
                                return (
                                    <line 
                                        key={idx} 
                                        x1={`${node1.x}%`} y1={`${node1.y}%`} 
                                        x2={`${node2.x}%`} y2={`${node2.y}%`} 
                                        stroke="#334155" strokeWidth="4" strokeDasharray={isPublic ? "8,8" : "none"}
                                    />
                                );
                            })}
                            {dnsOffline && (
                                <path d={`M ${NODES.dns.x-2}% ${NODES.dns.y-2}% L ${NODES.dns.x+2}% ${NODES.dns.y+2}% M ${NODES.dns.x-2}% ${NODES.dns.y+2}% L ${NODES.dns.x+2}% ${NODES.dns.y-2}%`} stroke="#ef4444" strokeWidth="5" className="opacity-80"/>
                            )}
                        </svg>

                        {Object.values(NODES).map(node => (
                            <NodeObj key={node.id} node={node} />
                        ))}

                        {(isPlaying || currentNodeIdx > 0 || errorMsg) && (
                            <div 
                                className={`absolute px-4 py-2 rounded-lg shadow-[0_0_20px_rgba(0,0,0,0.6)] transform -translate-x-1/2 -translate-y-1/2 z-40 flex items-center gap-2 ${currentStep.color} transition-all duration-700 ease-linear border border-white/20 whitespace-nowrap`}
                                style={{ left: `${currentNode.x}%`, top: `${currentNode.y}%` }}
                            >
                                <PacketIcon size={18} className="text-white" />
                                <span className="text-white text-sm font-bold tracking-wide">{currentStep.payload}</span>
                            </div>
                        )}

                        {errorMsg && (
                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-red-900/90 border border-red-500 text-white px-6 py-4 rounded-xl shadow-2xl z-30 flex items-center gap-3">
                                <AlertTriangle size={24} className="text-red-400" />
                                <span className="font-bold">{errorMsg}</span>
                            </div>
                        )}
                        
                        <div className="absolute top-4 left-4 bg-slate-800/80 backdrop-blur border border-slate-600 px-4 py-2 rounded-lg text-white font-mono text-sm z-10 shadow-lg">
                            阶段 {currentStepIdx + 1}/{scenario.steps.length}: <span className="font-bold text-blue-400">{currentStep.name}</span>
                        </div>
                    </div>

                    <div className="h-44 bg-slate-950 border border-slate-700 rounded-xl p-4 flex flex-col gap-2 shadow-inner font-mono text-sm overflow-hidden z-20">
                        <div className="flex justify-between items-center text-slate-400 border-b border-slate-800 pb-2">
                            <span className="font-bold text-slate-300">微观透视: 数据包实时封装状态</span>
                            <span className="text-xs px-2 py-1 bg-slate-800 rounded">当前物理位置: {currentNode.name}</span>
                        </div>
                        <div className="flex-1 flex gap-2 pt-2">
                            <div className="flex-1 bg-green-950/30 border border-green-800/50 rounded p-2 flex flex-col">
                                <span className="text-green-500 font-bold text-xs mb-1">以太网帧首部 (链路层)</span>
                                <div className="flex-1 flex flex-col justify-center gap-1">
                                    <div className="flex justify-between"><span className="text-slate-500">源 MAC:</span> <span className="text-green-300">{macSrc}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-500">目标 MAC:</span> <span className="text-green-300">{macDst}</span></div>
                                </div>
                            </div>
                            <div className="flex-1 bg-blue-950/30 border border-blue-800/50 rounded p-2 flex flex-col">
                                <span className="text-blue-500 font-bold text-xs mb-1">IP 首部 (网络层)</span>
                                <div className="flex-1 flex flex-col justify-center gap-1">
                                    <div className="flex justify-between"><span className="text-slate-500">源 IP:</span> <span className="text-blue-300">{ipSrc}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-500">目标 IP:</span> <span className="text-blue-300">{ipDst}</span></div>
                                </div>
                            </div>
                            <div className="flex-1 bg-yellow-950/30 border border-yellow-800/50 rounded p-2 flex flex-col">
                                <span className="text-yellow-500 font-bold text-xs mb-1">TCP/UDP (传输层)</span>
                                <div className="flex-1 flex items-center justify-center">
                                    <span className="text-yellow-300 text-base">{currentStep.proto}</span>
                                </div>
                            </div>
                            <div className="flex-[1.5] bg-purple-950/30 border border-purple-800/50 rounded p-2 flex flex-col">
                                <span className="text-purple-500 font-bold text-xs mb-1">应用层载荷 (Payload)</span>
                                <div className="flex-1 flex items-center justify-center p-2 bg-slate-900/50 rounded break-all">
                                    <span className="text-purple-300 text-sm font-semibold">{currentStep.payload}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const scenes = [
                { key: 'web', title: "Web 网页请求" },
                { key: 'im', title: "IM 聊天应用" },
                { key: 'video', title: "视频流媒体" },
                { key: 'summary', title: "分层协议总结" } 
            ];
            const [currentSceneIdx, setCurrentSceneIdx] = useState(0);

            return (
                <div className="flex flex-col h-screen bg-slate-900 text-slate-100 overflow-hidden font-sans">
                    <header className="px-6 py-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center shadow-md z-10">
                        <div className="flex items-center gap-4">
                            <div className="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg">
                                <Globe size={24} className="text-white" />
                            </div>
                            <h1 className="text-2xl font-black tracking-tight text-white">网络传输全链路解析</h1>
                        </div>
                        <a href="../../index.html" className="text-sm text-slate-400 hover:text-white transition-colors">← 返回合集</a>
                    </header>
                    
                    <main className="flex-1 p-6 overflow-hidden">
                        <div className="h-full w-full max-w-7xl mx-auto">
                            {scenes[currentSceneIdx].key === 'summary' 
                                ? <ProtocolSummary />
                                : <NetworkSimulator key={scenes[currentSceneIdx].key} scenarioKey={scenes[currentSceneIdx].key} />
                            }
                        </div>
                    </main>
                    
                    <footer className="px-6 py-4 bg-slate-800 border-t border-slate-700 flex justify-between items-center z-10">
                        <button 
                            onClick={() => setCurrentSceneIdx(prev => Math.max(0, prev - 1))}
                            disabled={currentSceneIdx === 0}
                            className="px-5 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 disabled:opacity-30 disabled:cursor-not-allowed transition-all flex items-center gap-2 font-medium"
                        >
                            <ChevronLeft size={20} />
                            {currentSceneIdx > 0 ? scenes[currentSceneIdx - 1].title : '无上一幕'}
                        </button>
                        
                        <div className="flex gap-2">
                            {scenes.map((scene, idx) => (
                                <button 
                                    key={scene.key}
                                    onClick={() => setCurrentSceneIdx(idx)}
                                    className={`w-3 h-3 rounded-full transition-all ${idx === currentSceneIdx ? 'bg-blue-500 scale-125' : 'bg-slate-600 hover:bg-slate-500'}`}
                                    title={scene.title}
                                />
                            ))}
                        </div>

                        <button 
                            onClick={() => setCurrentSceneIdx(prev => Math.min(scenes.length - 1, prev + 1))}
                            disabled={currentSceneIdx === scenes.length - 1}
                            className="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 disabled:opacity-30 disabled:cursor-not-allowed transition-all flex items-center gap-2 font-medium shadow-lg"
                        >
                            {currentSceneIdx < scenes.length - 1 ? scenes[currentSceneIdx + 1].title : '已是最后一幕'}
                            <ChevronRight size={20} />
                        </button>
                    </footer>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
