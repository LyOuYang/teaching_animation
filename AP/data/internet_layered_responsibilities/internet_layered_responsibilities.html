<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Mission Control | 没有总指挥的互联网</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap');

        :root {
            --line: rgba(148, 163, 184, 0.16);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            font-family: 'Space Grotesk', sans-serif;
            color: #e2e8f0;
            background:
                radial-gradient(circle at 10% 15%, rgba(56, 189, 248, 0.18), transparent 24%),
                radial-gradient(circle at 86% 10%, rgba(244, 114, 182, 0.12), transparent 18%),
                radial-gradient(circle at 50% 100%, rgba(34, 197, 94, 0.08), transparent 28%),
                linear-gradient(180deg, #07101b, #081321 52%, #04070d);
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(148, 163, 184, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.05) 1px, transparent 1px);
            background-size: 34px 34px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.9), transparent);
            pointer-events: none;
        }

        .glass {
            background: rgba(8, 18, 32, 0.8);
            border: 1px solid var(--line);
            backdrop-filter: blur(18px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .mono { font-family: 'IBM Plex Mono', monospace; }

        .scene-enter { animation: sceneEnter 0.32s ease-out; }
        @keyframes sceneEnter {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .control-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border-radius: 1rem;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(15, 23, 42, 0.88);
            color: #e2e8f0;
            padding: 0.78rem 1rem;
            font-size: 0.9rem;
            font-weight: 700;
            transition: 0.18s ease;
        }

        .control-btn.primary {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.24), rgba(56, 189, 248, 0.08));
            border-color: rgba(56, 189, 248, 0.35);
        }

        .control-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .control-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            border-color: rgba(56, 189, 248, 0.38);
        }
    </style>
</head>
<body>
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel" data-presets="react" data-type="module">
        import React, { useEffect, useState } from "react";
        import { createRoot } from "react-dom/client";
        import {
            ChevronLeft,
            ChevronRight,
            Layers3,
            Globe2,
            Network,
            Box,
            Route,
            Gauge,
            Play,
            Pause,
            RefreshCw
        } from "lucide-react";

        const Card = ({ children, className = "" }) => (
            <div className={`glass rounded-[28px] p-5 md:p-6 ${className}`}>{children}</div>
        );

        const Eyebrow = ({ children }) => (
            <div className="mb-3 text-[11px] font-bold uppercase tracking-[0.28em] text-slate-500">{children}</div>
        );

        const TeachingPanel = ({ intro, operate, focus, line, takeaway }) => (
            <Card data-testid="teaching-panel" className="bg-slate-950/55">
                <Eyebrow>教师讲稿</Eyebrow>
                <div className="space-y-4 text-sm leading-relaxed text-slate-300">
                    <div><div className="mb-1 font-bold text-white">导入</div><div>{intro}</div></div>
                    <div><div className="mb-1 font-bold text-white">动画操作</div><div>{operate}</div></div>
                    <div><div className="mb-1 font-bold text-white">学生观察点</div><div>{focus}</div></div>
                    <div><div className="mb-1 font-bold text-white">教师标准表述</div><div className="rounded-2xl border border-slate-800 bg-slate-950/75 p-3 text-slate-200">{line}</div></div>
                    <div><div className="mb-1 font-bold text-white">一句话收束</div><div className="text-sky-100">{takeaway}</div></div>
                </div>
            </Card>
        );

        const PlaceholderStage = ({ icon, title, summary, tags }) => (
            <Card className="min-h-[420px]">
                <Eyebrow>Scene Preview</Eyebrow>
                <div className="flex h-full flex-col justify-between">
                    <div>
                        <div className="mb-4 inline-flex rounded-[22px] bg-slate-950/80 p-4 ring-1 ring-slate-800">{icon}</div>
                        <h2 className="text-3xl font-bold text-white">{title}</h2>
                        <p className="mt-3 max-w-3xl text-sm leading-relaxed text-slate-400">{summary}</p>
                    </div>
                    <div className="rounded-[24px] border border-slate-800 bg-slate-950/65 p-4">
                        <div className="mb-3 text-sm font-bold text-slate-300">Key Concepts</div>
                        <div className="flex flex-wrap gap-2">
                            {tags.map((tag) => (
                                <div key={tag} className="mono rounded-full bg-slate-900 px-4 py-2 text-xs font-semibold text-sky-100 ring-1 ring-slate-800">
                                    {tag}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </Card>
        );

        const SERVICE_ITEMS = [
            {
                id: "web",
                title: "Web",
                icon: "🌐",
                summary: "打开网页、加载网站内容",
                note: "Web is one service on top of the Internet."
            },
            {
                id: "chat",
                title: "Chat",
                icon: "💬",
                summary: "发送和接收即时消息",
                note: "聊天不是网页本身，但也依赖 Internet。"
            },
            {
                id: "video",
                title: "Video",
                icon: "🎬",
                summary: "播放和传输视频流",
                note: "视频服务使用 Internet，但不等于 Web 的全部。"
            },
            {
                id: "mail",
                title: "Mail",
                icon: "✉️",
                summary: "发送和接收电子邮件",
                note: "邮件是另一种网络服务。"
            }
        ];

        const REQUEST_DUTIES = [
            "我要什么",
            "按什么规则交流",
            "往哪条路走",
            "怎样真正发送与接收"
        ];

        const REQUEST_STEPS = [
            { id: "click", label: "点击链接", role: "我要什么", note: "浏览器发起网页请求" },
            { id: "format", label: "Protocol：规定怎么说", role: "按什么规则交流", note: "请求变成统一格式" },
            { id: "split", label: "拆成多个 packet", role: "按什么规则交流", note: "大请求拆成小包" },
            { id: "route", label: "沿网络路径前进", role: "往哪条路走", note: "不同 packet 可以走不同路线" },
            { id: "response", label: "服务器返回内容", role: "怎样真正发送与接收", note: "网页内容开始回传" },
            { id: "render", label: "页面按块填充", role: "我要什么", note: "浏览器重组并渲染页面" }
        ];

        const REQUEST_PACKET_BASE = [
            { id: "p1", route: "上方线路", tone: "bg-sky-300 text-slate-950" },
            { id: "p2", route: "主线路", tone: "bg-emerald-300 text-slate-950" },
            { id: "p3", route: "下方线路", tone: "bg-amber-300 text-slate-950" }
        ];

        const MESSAGE_SAMPLES = {
            short: "GET /index",
            medium: "GET /unit4/network",
            long: "GET /apcsp/unit4/layered-responsibilities"
        };

        const chunkText = (text, size = 10) => {
            const chunks = [];
            for (let index = 0; index < text.length; index += size) {
                chunks.push(text.slice(index, index + size));
            }
            return chunks;
        };

        const InternetVsWebScene = () => {
            const [selectedService, setSelectedService] = useState("web");
            const selected = SERVICE_ITEMS.find((item) => item.id === selectedService) ?? SERVICE_ITEMS[0];

            return (
                <div className="scene-enter grid gap-6 xl:grid-cols-[1.16fr_0.84fr]">
                    <Card className="min-h-[420px]">
                        <Eyebrow>Scene 1 · Internet vs Web</Eyebrow>
                        <div className="mb-6 flex items-start gap-4">
                            <div className="rounded-[22px] bg-slate-950/80 p-4 ring-1 ring-slate-800">
                                <Globe2 size={30} className="text-sky-300" />
                            </div>
                            <div>
                                <h2 className="text-3xl font-bold text-white">Web 不是整个 Internet</h2>
                                <p className="mt-2 max-w-3xl text-sm leading-relaxed text-slate-400">
                                    同一条 Internet 基础网络上，可以跑网页、聊天、视频和邮件。Web 只是其中一种服务。
                                </p>
                            </div>
                        </div>

                        <div className="grid gap-4 md:grid-cols-2">
                            {SERVICE_ITEMS.map((item) => {
                                const active = item.id === selectedService;
                                return (
                                    <button
                                        key={item.id}
                                        onClick={() => setSelectedService(item.id)}
                                        className={`rounded-[24px] border p-5 text-left transition ${
                                            active
                                                ? "border-sky-400/35 bg-sky-400/10"
                                                : "border-slate-800 bg-slate-950/72"
                                        }`}
                                    >
                                        <div className="mb-3 text-3xl">{item.icon}</div>
                                        <div className="text-lg font-bold text-white">{item.title}</div>
                                        <div className="mt-2 text-sm text-slate-400">{item.summary}</div>
                                    </button>
                                );
                            })}
                        </div>

                        <div className="mt-6 rounded-[24px] border border-slate-800 bg-slate-950/65 p-5">
                            <div className="mb-4 text-sm font-bold text-slate-300">共享的 Internet 基础网络</div>
                            <div className="rounded-[24px] border border-sky-400/15 bg-gradient-to-r from-sky-400/10 via-cyan-400/5 to-emerald-400/10 px-4 py-5">
                                <div className="flex flex-wrap items-center justify-between gap-3">
                                    {SERVICE_ITEMS.map((item) => (
                                        <div key={item.id} className={`rounded-full px-4 py-2 text-xs font-bold ring-1 ${
                                            item.id === selectedService
                                                ? "bg-sky-400/18 text-sky-100 ring-sky-400/30"
                                                : "bg-slate-950/80 text-slate-400 ring-slate-800"
                                        }`}>
                                            {item.title}
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-4 h-3 rounded-full bg-slate-950/80 ring-1 ring-slate-800">
                                    <div className="h-full rounded-full bg-gradient-to-r from-sky-300 via-cyan-300 to-emerald-300" style={{ width: "100%" }} />
                                </div>
                                <div className="mt-3 text-sm text-slate-400">
                                    你当前选中的是 <span className="font-bold text-white">{selected.title}</span>：
                                    <span className="ml-2">{selected.note}</span>
                                </div>
                            </div>
                        </div>
                    </Card>
                    <TeachingPanel
                        intro="先澄清学生最常见的概念混淆：Web 不是整个 Internet。"
                        operate="点击不同服务卡片，强调它们共享同一条 Internet 基础网络。"
                        focus="学生要看到：Web 是服务，Internet 是底层基础设施。"
                        line="Internet 是让设备互连的基础网络；Web 是跑在这张网络上的一种服务。"
                        takeaway="Web uses the Internet, but is not the whole Internet."
                    />
                </div>
            );
        };

        const WebRequestScene = () => {
            const [stepIndex, setStepIndex] = useState(0);
            const [renderBlocks, setRenderBlocks] = useState(0);
            const [autoPlay, setAutoPlay] = useState(false);

            const currentStep = REQUEST_STEPS[stepIndex];
            const sceneState = {
                currentStep: currentStep.id,
                packets: REQUEST_PACKET_BASE.map((packet) => ({
                    ...packet,
                    route: stepIndex >= 3 ? packet.route : "主线路",
                    requestVisible: stepIndex >= 2 && stepIndex <= 3,
                    responseVisible: stepIndex >= 4,
                    delivered: stepIndex >= 4,
                    returned: stepIndex >= 4
                })),
                responseStarted: stepIndex >= 4,
                renderBlocks,
                isReassembled: renderBlocks >= 4
            };

            useEffect(() => {
                if (stepIndex < 5) {
                    setRenderBlocks(0);
                }
            }, [stepIndex]);

            useEffect(() => {
                if (!autoPlay) return undefined;

                if (stepIndex < 5) {
                    const timer = window.setTimeout(() => {
                        setStepIndex((value) => Math.min(value + 1, REQUEST_STEPS.length - 1));
                    }, 950);
                    return () => window.clearTimeout(timer);
                }

                if (renderBlocks < 4) {
                    const timer = window.setTimeout(() => {
                        setRenderBlocks((value) => Math.min(value + 1, 4));
                    }, 320);
                    return () => window.clearTimeout(timer);
                }

                setAutoPlay(false);
                return undefined;
            }, [autoPlay, stepIndex, renderBlocks]);

            const advance = () => {
                if (stepIndex < 5) {
                    setStepIndex((value) => Math.min(value + 1, REQUEST_STEPS.length - 1));
                    return;
                }
                if (renderBlocks < 4) {
                    setRenderBlocks((value) => Math.min(value + 1, 4));
                }
            };

            const reset = () => {
                setAutoPlay(false);
                setStepIndex(0);
                setRenderBlocks(0);
            };

            const requestPacketLeft = stepIndex <= 2 ? "8%" : stepIndex === 3 ? "56%" : "82%";
            const responsePacketLeft = stepIndex === 4 ? "18%" : stepIndex === 5 ? "8%" : "80%";

            return (
                <div className="scene-enter grid gap-6 xl:grid-cols-[1.16fr_0.84fr]">
                    <Card>
                        <Eyebrow>Scene 2 · 打开一个网页时，谁在负责什么</Eyebrow>
                        <div className="mb-6 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
                            <div>
                                <h2 className="text-3xl font-bold text-white">让真实请求过程自己解释分层职责</h2>
                                <p className="mt-2 max-w-3xl text-sm leading-relaxed text-slate-400">
                                    点击一个网页链接后，请求会被格式化、拆成 packet、沿网络前进、回流并重新渲染成网页内容。
                                </p>
                            </div>
                            <div className="flex flex-wrap gap-3">
                                <button onClick={advance} className="control-btn">Step</button>
                                <button onClick={() => setAutoPlay((value) => !value)} className="control-btn primary">
                                    {autoPlay ? <Pause size={18} /> : <Play size={18} />}
                                    {autoPlay ? "Pause" : "Auto Run"}
                                </button>
                                <button onClick={reset} className="control-btn">
                                    <RefreshCw size={18} />
                                    Reset
                                </button>
                            </div>
                        </div>

                        <div className="mb-6 grid gap-3 md:grid-cols-4">
                            {REQUEST_DUTIES.map((duty) => {
                                const active = duty === currentStep.role;
                                return (
                                    <div
                                        key={duty}
                                        className={`rounded-[22px] border px-4 py-4 transition ${
                                            active
                                                ? "border-sky-400/35 bg-sky-400/12"
                                                : "border-slate-800 bg-slate-950/72"
                                        }`}
                                    >
                                        <div className="text-[11px] font-bold uppercase tracking-[0.22em] text-slate-500">Responsibility</div>
                                        <div className={`mt-2 text-sm font-bold ${active ? "text-sky-100" : "text-slate-300"}`}>{duty}</div>
                                    </div>
                                );
                            })}
                        </div>

                        <div className="mb-6 rounded-[24px] border border-slate-800 bg-slate-950/65 p-4">
                            <div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
                                <div>
                                    <div className="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-500">Current Step</div>
                                    <div className="mt-2 text-xl font-bold text-white">{currentStep.label}</div>
                                    <div className="mt-1 text-sm text-slate-400">{currentStep.note}</div>
                                </div>
                                <div className="rounded-[18px] border border-slate-800 bg-slate-900/80 px-4 py-3">
                                    <div className="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-500">Scene State</div>
                                    <div className="mono mt-2 text-xs leading-relaxed text-slate-300">
                                        currentStep: {sceneState.currentStep}<br />
                                        responseStarted: {String(sceneState.responseStarted)}<br />
                                        renderBlocks: {sceneState.renderBlocks}<br />
                                        isReassembled: {String(sceneState.isReassembled)}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="grid gap-5 xl:grid-cols-[0.52fr_0.48fr]">
                            <div className="rounded-[26px] border border-slate-800 bg-slate-950/72 p-5">
                                <div className="mb-4 flex items-center justify-between">
                                    <div>
                                        <div className="text-lg font-bold text-white">Browser</div>
                                        <div className="text-sm text-slate-400">我要一个网页</div>
                                    </div>
                                    <div className="mono rounded-full bg-slate-900 px-3 py-2 text-xs font-semibold text-sky-100 ring-1 ring-slate-800">
                                        {currentStep.role}
                                    </div>
                                </div>

                                <div className="rounded-[22px] border border-slate-800 bg-slate-900/85 p-4">
                                    <div className="mb-3 rounded-full bg-slate-950/90 px-4 py-3 text-sm text-slate-300 ring-1 ring-slate-800">
                                        https://apcsp.example/unit4/network
                                    </div>

                                    <div className={`mb-4 rounded-[18px] border px-4 py-3 ${
                                        stepIndex >= 1
                                            ? "border-sky-400/25 bg-sky-400/10 text-sky-100"
                                            : "border-slate-800 bg-slate-950/80 text-slate-400"
                                    }`}>
                                        <div className="text-[11px] font-bold uppercase tracking-[0.22em]">Request Card</div>
                                        <div className="mt-2 text-sm font-semibold">
                                            {stepIndex === 0 ? "点击链接，准备请求网页" : "Protocol：规定怎么说"}
                                        </div>
                                    </div>

                                    <div className="mb-4 grid gap-2">
                                        {Array.from({ length: 4 }, (_, index) => (
                                            <div
                                                key={index}
                                                className={`h-10 rounded-2xl border transition ${
                                                    index < renderBlocks
                                                        ? "border-emerald-300/35 bg-emerald-300/18"
                                                        : "border-slate-800 bg-slate-950/80"
                                                }`}
                                            />
                                        ))}
                                    </div>

                                    <div className="text-sm text-slate-400">
                                        {renderBlocks === 0
                                            ? "页面内容尚未完成渲染。"
                                            : renderBlocks < 4
                                                ? `页面正在按块填充：${renderBlocks} / 4`
                                                : "网页内容已完成重组并显示。"}
                                    </div>
                                </div>
                            </div>

                            <div className="rounded-[26px] border border-slate-800 bg-slate-950/72 p-5">
                                <div className="mb-4 flex items-center justify-between">
                                    <div>
                                        <div className="text-lg font-bold text-white">Network Path</div>
                                        <div className="text-sm text-slate-400">packet / routing / response</div>
                                    </div>
                                    <div className="mono rounded-full bg-slate-900 px-3 py-2 text-xs font-semibold text-sky-100 ring-1 ring-slate-800">
                                        {sceneState.packets.length} packets
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    {["上方线路", "主线路", "下方线路"].map((routeName) => (
                                        <div key={routeName} className="relative h-16 rounded-[20px] border border-slate-800 bg-slate-950/80 px-4 py-3">
                                            <div className="mb-2 flex items-center justify-between text-xs font-bold uppercase tracking-[0.22em] text-slate-500">
                                                <span>{routeName}</span>
                                                <span>Browser -> Router -> Server</span>
                                            </div>
                                            <div className="relative h-6">
                                                <div className="absolute left-[8%] top-1/2 h-2 w-[78%] -translate-y-1/2 rounded-full bg-slate-800" />
                                                <div className="absolute left-[8%] top-1/2 h-4 w-4 -translate-y-1/2 rounded-full border border-slate-700 bg-slate-950" />
                                                <div className="absolute left-[45%] top-1/2 h-4 w-4 -translate-y-1/2 rounded-full border border-slate-700 bg-slate-950" />
                                                <div className="absolute left-[82%] top-1/2 h-4 w-4 -translate-y-1/2 rounded-full border border-slate-700 bg-slate-950" />

                                                {sceneState.packets
                                                    .filter((packet) => packet.route === routeName || (stepIndex < 3 && routeName === "主线路"))
                                                    .map((packet) => (
                                                        <React.Fragment key={packet.id}>
                                                            {packet.requestVisible ? (
                                                                <div
                                                                    className={`absolute top-1/2 -translate-y-1/2 rounded-full px-3 py-1 text-xs font-bold transition-all duration-700 ${packet.tone}`}
                                                                    style={{ left: requestPacketLeft }}
                                                                >
                                                                    {packet.id}
                                                                </div>
                                                            ) : null}
                                                            {packet.responseVisible ? (
                                                                <div
                                                                    className={`absolute top-1/2 -translate-y-1/2 rounded-full border border-white/10 px-3 py-1 text-xs font-bold transition-all duration-700 ${packet.tone}`}
                                                                    style={{ left: responsePacketLeft, opacity: renderBlocks === 4 ? 0.45 : 1 }}
                                                                >
                                                                    {packet.id}
                                                                </div>
                                                            ) : null}
                                                        </React.Fragment>
                                                    ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="mt-5 rounded-[22px] border border-slate-800 bg-slate-900/80 p-4">
                                    <div className="mb-2 text-sm font-bold text-white">Packet Contract</div>
                                    <div className="mono text-xs leading-relaxed text-slate-300">
                                        split -> create visible packet identities<br />
                                        route -> each packet can choose its own path<br />
                                        response -> return starts after outbound travel<br />
                                        render -> browser fills blocks after reassembly
                                    </div>
                                </div>
                            </div>
                        </div>
                    </Card>
                    <TeachingPanel
                        intro="这一幕不靠长比喻，直接讲真实过程。"
                        operate="固定职责卡，点 Step 或 Auto Run，让学生始终追踪这一秒是谁在负责什么。"
                        focus="学生要把请求、packet、routing、response、render 对应到不同职责。"
                        line="网页能打开，不是因为一个地方知道一切，而是不同职责按照 protocol 协作完成。"
                        takeaway="先看职责，再命名分层。"
                    />
                </div>
            );
        };

        const PacketScene = () => {
            const [sampleKey, setSampleKey] = useState("medium");
            const [formatted, setFormatted] = useState(false);
            const [split, setSplit] = useState(false);

            const rawMessage = MESSAGE_SAMPLES[sampleKey];
            const protocolMessage = `HTTP REQUEST\\nPATH: ${rawMessage.replace("GET ", "")}\\nHOST: apcsp.example`;
            const packetChunks = chunkText(protocolMessage, 12);

            return (
                <div className="scene-enter grid gap-6 xl:grid-cols-[1.16fr_0.84fr]">
                    <Card>
                        <Eyebrow>Scene 3 · Protocol + Packet</Eyebrow>
                        <div className="mb-6 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
                            <div>
                                <h2 className="text-3xl font-bold text-white">先统一说法，再拆成小包</h2>
                                <p className="mt-2 max-w-3xl text-sm leading-relaxed text-slate-400">
                                    `protocol` 负责规定格式，`packet` 负责把数据拆成更容易传输和重组的单位。
                                </p>
                            </div>
                            <div className="flex flex-wrap gap-3">
                                {Object.keys(MESSAGE_SAMPLES).map((key) => (
                                    <button
                                        key={key}
                                        onClick={() => {
                                            setSampleKey(key);
                                            setFormatted(false);
                                            setSplit(false);
                                        }}
                                        className={`rounded-full px-4 py-2 text-xs font-bold ${
                                            sampleKey === key
                                                ? "bg-sky-400/16 text-sky-100 ring-1 ring-sky-400/35"
                                                : "bg-slate-950/70 text-slate-400 ring-1 ring-slate-800"
                                        }`}
                                    >
                                        {key}
                                    </button>
                                ))}
                                <button onClick={() => setFormatted(true)} className="control-btn">Apply Protocol</button>
                                <button onClick={() => { setFormatted(true); setSplit(true); }} className="control-btn primary">Split to Packet</button>
                            </div>
                        </div>

                        <div className="grid gap-5 xl:grid-cols-[0.48fr_0.52fr]">
                            <div className="rounded-[26px] border border-slate-800 bg-slate-950/72 p-5">
                                <div className="mb-4 text-lg font-bold text-white">Message Evolution</div>
                                <div className="space-y-4">
                                    <div className="rounded-[22px] border border-slate-800 bg-slate-900/80 p-4">
                                        <div className="mb-2 text-[11px] font-bold uppercase tracking-[0.22em] text-slate-500">Raw Intent</div>
                                        <div className="mono text-sm text-white">{rawMessage}</div>
                                    </div>
                                    <div className={`rounded-[22px] border p-4 transition ${
                                        formatted ? "border-sky-400/30 bg-sky-400/10" : "border-slate-800 bg-slate-900/80"
                                    }`}>
                                        <div className="mb-2 text-[11px] font-bold uppercase tracking-[0.22em] text-slate-500">Protocol Rule</div>
                                        <div className="text-sm text-slate-300">同一条请求要按统一格式表达，别的系统才能正确理解。</div>
                                        <div className="mono mt-3 whitespace-pre-line text-xs leading-relaxed text-white">{formatted ? protocolMessage : "等待格式化..."}</div>
                                    </div>
                                </div>
                            </div>

                            <div className="rounded-[26px] border border-slate-800 bg-slate-950/72 p-5">
                                <div className="mb-4 flex items-center justify-between">
                                    <div>
                                        <div className="text-lg font-bold text-white">Packet View</div>
                                        <div className="text-sm text-slate-400">拆小包后更容易传输、补发和重组</div>
                                    </div>
                                    <div className="mono rounded-full bg-slate-900 px-3 py-2 text-xs font-semibold text-sky-100 ring-1 ring-slate-800">
                                        {split ? `${packetChunks.length} packet` : "not split"}
                                    </div>
                                </div>
                                <div className="grid gap-3">
                                    {packetChunks.map((chunk, index) => (
                                        <div
                                            key={`${chunk}-${index}`}
                                            className={`rounded-[20px] border px-4 py-3 transition ${
                                                split
                                                    ? "border-emerald-300/25 bg-emerald-300/10"
                                                    : "border-slate-800 bg-slate-900/70 opacity-35"
                                            }`}
                                        >
                                            <div className="mb-2 flex items-center justify-between">
                                                <div className="mono text-xs font-bold text-slate-400">packet {index + 1}</div>
                                                <div className="mono text-xs text-slate-500">seq {index + 1}/{packetChunks.length}</div>
                                            </div>
                                            <div className="mono text-sm text-white">{split ? chunk : "..."}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </Card>
                    <TeachingPanel
                        intro="学生容易只记词，不理解规则和分包的必要性。"
                        operate="先点 Apply Protocol，再点 Split to Packet，让学生看到两个动作不是一回事。"
                        focus="学生要看到：protocol 决定怎么说，packet 决定怎么分。"
                        line="如果没有 protocol，不同系统无法理解彼此；如果不分成 packet，传输和补发都会更困难。"
                        takeaway="Protocol gives the rules. Packet gives the unit."
                    />
                </div>
            );
        };

        const RoutingScene = () => (
            <div className="scene-enter grid gap-6 xl:grid-cols-[1.16fr_0.84fr]">
                <PlaceholderStage
                    icon={<Route size={30} className="text-sky-300" />}
                    title="Routing + Fault Tolerance"
                    summary="当一条路径断开时，packet 可以选择其他路径继续前进，这就是 routing 和 fault tolerance 的课堂主画面。"
                    tags={["routing", "fault tolerance", "redundancy", "path"]}
                />
                <TeachingPanel
                    intro="这一幕负责打破‘消息必须走固定一条路’的误解。"
                    operate="切断一条链路，让 packet 改道后继续到达。"
                    focus="学生要看见：不同 packet 可以走不同路，冗余让系统更稳。"
                    line="互联网的可靠性来自分布式路径和冗余，而不是一个中央控制者。"
                    takeaway="Routing plus redundancy creates fault tolerance."
                />
            </div>
        );

        const ScaleScene = () => (
            <div className="scene-enter grid gap-6 xl:grid-cols-[1.16fr_0.84fr]">
                <PlaceholderStage
                    icon={<Gauge size={30} className="text-sky-300" />}
                    title="Bandwidth + Scalability"
                    summary="对比窄通道和宽通道的流量，再逐步增加设备数量，讲清 bandwidth 和 scalability。"
                    tags={["bandwidth", "scalability", "traffic", "growth"]}
                />
                <TeachingPanel
                    intro="这里不讲复杂公式，只讲系统为什么能继续承载更多数据和设备。"
                    operate="对比数据通道宽窄，再增加节点数量。"
                    focus="学生要区分：bandwidth 是流量能力，scalability 是扩展能力。"
                    line="好的 Internet 设计不只要现在能工作，还要在流量和设备增长时继续工作。"
                    takeaway="Bandwidth affects throughput. Scalability affects growth."
                />
            </div>
        );

        const LayerSummaryScene = () => (
            <div className="scene-enter grid gap-6 xl:grid-cols-[1.16fr_0.84fr]">
                <PlaceholderStage
                    icon={<Layers3 size={30} className="text-sky-300" />}
                    title="简化分层"
                    summary="最后把前面看到的职责卡翻成简化层名：Application、Transport、Internet、Link / Physical。"
                    tags={["Application", "Transport", "Internet", "Link / Physical"]}
                />
                <TeachingPanel
                    intro="层图只在最后出现，用来整理前面的职责直觉。"
                    operate="先显示职责卡，再翻面显示层名。"
                    focus="学生要理解：分层是职责边界，不是背诵任务。"
                    line="分层帮助系统把复杂任务拆开，让局部可以替换、扩展和协作。"
                    takeaway="Layering is about responsibilities, not memorization."
                />
            </div>
        );

        const scenes = [
            {
                title: "Internet vs Web",
                subtitle: "先拆开服务和网络",
                objective: "区分 Internet 与 Web，建立本课语境",
                component: <InternetVsWebScene />
            },
            {
                title: "打开一个网页",
                subtitle: "真实消息过程动画",
                objective: "看见谁在负责请求、packet、routing 和 render",
                component: <WebRequestScene />
            },
            {
                title: "Protocol + Packet",
                subtitle: "规则和分包",
                objective: "理解 protocol 和 packet 为什么必要",
                component: <PacketScene />
            },
            {
                title: "Routing + Fault Tolerance",
                subtitle: "断路后仍能送达",
                objective: "看清 routing、redundancy 和 fault tolerance",
                component: <RoutingScene />
            },
            {
                title: "Bandwidth + Scalability",
                subtitle: "网络为什么还能长大",
                objective: "讲清 bandwidth 与 scalability 的教学点",
                component: <ScaleScene />
            },
            {
                title: "简化分层",
                subtitle: "最后再命名",
                objective: "把职责卡整理成简化层图",
                component: <LayerSummaryScene />
            }
        ];

        const App = () => {
            const [sceneIndex, setSceneIndex] = useState(0);
            const scene = scenes[sceneIndex];

            return (
                <div className="flex h-screen flex-col overflow-hidden">
                    <header className="glass border-b border-slate-800/90 px-5 py-4 md:px-8">
                        <div className="flex flex-col gap-5 xl:flex-row xl:items-end xl:justify-between">
                            <div className="flex items-start gap-4">
                                <div className="rounded-[24px] bg-slate-950/80 p-4 ring-1 ring-slate-800">
                                    <Layers3 size={28} className="text-sky-300" />
                                </div>
                                <div>
                                    <div className="text-[11px] font-bold uppercase tracking-[0.28em] text-slate-500">AP CSP Teaching Demo</div>
                                    <h1 className="mt-2 text-3xl font-bold tracking-tight text-white">Internet Mission Control</h1>
                                    <p className="mt-2 max-w-2xl text-sm leading-relaxed text-slate-400">
                                        没有总指挥的互联网：从 Web 请求、packet、routing 到 bandwidth 和简化分层。
                                    </p>
                                </div>
                            </div>
                            <div className="rounded-[24px] border border-slate-800 bg-slate-950/75 px-4 py-4">
                                <div className="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-500">Current Objective</div>
                                <div className="mt-2 max-w-xl text-sm text-slate-300">{scene.objective}</div>
                            </div>
                        </div>
                        <div className="mt-5 flex flex-wrap gap-2">
                            {scenes.map((item, index) => (
                                <button
                                    key={item.title}
                                    onClick={() => setSceneIndex(index)}
                                    className={`rounded-full px-4 py-2 text-xs font-bold ${
                                        sceneIndex === index
                                            ? "bg-sky-400/16 text-sky-100 ring-1 ring-sky-400/35"
                                            : "bg-slate-950/70 text-slate-400 ring-1 ring-slate-800"
                                    }`}
                                >
                                    {index + 1}. {item.title}
                                </button>
                            ))}
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto px-4 py-5 md:px-6 xl:px-8">
                        <div className="mx-auto w-full max-w-[1500px]">
                            <div className="mb-5 rounded-[28px] border border-slate-800 bg-slate-950/55 px-5 py-4">
                                <div className="text-[11px] font-bold uppercase tracking-[0.28em] text-slate-500">Current Scene</div>
                                <div className="mt-2 text-2xl font-bold text-white">{scene.title}</div>
                                <div className="mt-1 text-sm text-slate-400">{scene.subtitle}</div>
                            </div>
                            {scene.component}
                        </div>
                    </main>

                    <footer className="glass border-t border-slate-800/90 px-5 py-4 md:px-8">
                        <div className="flex items-center justify-between gap-4">
                            <button
                                onClick={() => setSceneIndex((value) => Math.max(0, value - 1))}
                                disabled={sceneIndex === 0}
                                className="control-btn"
                            >
                                <ChevronLeft size={18} />
                                Previous
                            </button>
                            <div className="hidden items-center gap-2 md:flex">
                                {scenes.map((item, index) => (
                                    <div
                                        key={item.title}
                                        className={`h-2 rounded-full ${
                                            sceneIndex === index
                                                ? "w-12 bg-sky-300"
                                                : index < sceneIndex
                                                    ? "w-7 bg-slate-600"
                                                    : "w-7 bg-slate-800"
                                        }`}
                                    />
                                ))}
                            </div>
                            <button
                                onClick={() => setSceneIndex((value) => Math.min(scenes.length - 1, value + 1))}
                                disabled={sceneIndex === scenes.length - 1}
                                className="control-btn primary"
                            >
                                Next
                                <ChevronRight size={18} />
                            </button>
                        </div>
                    </footer>
                </div>
            );
        };

        createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
