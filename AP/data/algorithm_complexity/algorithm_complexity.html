<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complexity Studio | 从步骤数到 Big-O</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap');

        :root {
            --line: rgba(148, 163, 184, 0.14);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            font-family: 'Space Grotesk', sans-serif;
            color: #e2e8f0;
            background:
                radial-gradient(circle at 10% 10%, rgba(93, 214, 255, 0.18), transparent 24%),
                radial-gradient(circle at 84% 14%, rgba(255, 189, 109, 0.14), transparent 20%),
                radial-gradient(circle at 50% 100%, rgba(110, 231, 183, 0.12), transparent 28%),
                linear-gradient(180deg, #091019, #071019 52%, #04070d);
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(148, 163, 184, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.05) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.88), transparent);
            pointer-events: none;
        }

        .glass {
            background: rgba(7, 18, 30, 0.8);
            border: 1px solid var(--line);
            backdrop-filter: blur(18px);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
        }

        .mono { font-family: 'IBM Plex Mono', monospace; }

        .scene-enter { animation: sceneEnter 0.36s ease-out; }
        @keyframes sceneEnter {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .control-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
            border-radius: 1rem;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(15, 23, 42, 0.86);
            color: #e2e8f0;
            padding: 0.78rem 1rem;
            font-size: 0.9rem;
            font-weight: 700;
            transition: 0.18s ease;
        }

        .control-btn.primary {
            background: linear-gradient(135deg, rgba(93, 214, 255, 0.24), rgba(93, 214, 255, 0.08));
            border-color: rgba(93, 214, 255, 0.35);
        }

        .control-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .control-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            border-color: rgba(93, 214, 255, 0.38);
        }

        input[type="range"] { accent-color: #5dd6ff; }
    </style>
</head>
<body>
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel" data-presets="react" data-type="module">
        import React, { useEffect, useMemo, useState } from "react";
        import { createRoot } from "react-dom/client";
        import {
            ArrowRight, Braces, ChevronLeft, ChevronRight, Grid2x2, Layers3, Pause,
            Play, RefreshCw, Search, Sigma, Sparkles, TimerReset
        } from "lucide-react";

        const SIZE_OPTIONS = [8, 16, 32, 64, 128];
        const GRID_SIZES = [4, 6, 8, 10, 12];
        const formatLog = (n) => Math.ceil(Math.log2(n));
        const targetIndexFor = (size, mode) => mode === "Near Start" ? 1 : mode === "Middle" ? Math.floor(size / 2) : size - 2;

        const Card = ({ children, className = "" }) => <div className={`glass rounded-[28px] p-5 md:p-6 ${className}`}>{children}</div>;
        const Eyebrow = ({ children }) => <div className="mb-3 text-[11px] font-bold uppercase tracking-[0.28em] text-slate-500">{children}</div>;

        const Metric = ({ label, value, note }) => (
            <div className="rounded-[24px] bg-slate-950/75 px-4 py-4 ring-1 ring-slate-800">
                <div className="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-500">{label}</div>
                <div className="mt-2 text-2xl font-bold text-white">{value}</div>
                {note ? <div className="mt-1 text-xs text-slate-400">{note}</div> : null}
            </div>
        );

        const TeachingPanel = ({ intro, operate, focus, line, takeaway }) => (
            <Card className="bg-slate-950/55">
                <Eyebrow>Teacher Script</Eyebrow>
                <div className="space-y-4 text-sm leading-relaxed text-slate-300">
                    <div><div className="mb-1 font-bold text-white">导入</div><div>{intro}</div></div>
                    <div><div className="mb-1 font-bold text-white">动画操作</div><div>{operate}</div></div>
                    <div><div className="mb-1 font-bold text-white">学生观察点</div><div>{focus}</div></div>
                    <div><div className="mb-1 font-bold text-white">教师标准表述</div><div className="rounded-2xl border border-slate-800 bg-slate-950/75 p-3 text-slate-200">{line}</div></div>
                    <div><div className="mb-1 font-bold text-white">一句话收束</div><div className="text-sky-100">{takeaway}</div></div>
                </div>
            </Card>
        );

        const ValuePill = ({ active, faded, children, tone = "sky" }) => {
            const activeClass = tone === "amber"
                ? "bg-amber-400/20 text-amber-100 ring-amber-400/35"
                : tone === "mint"
                    ? "bg-emerald-400/20 text-emerald-100 ring-emerald-400/35"
                    : "bg-sky-400/20 text-sky-100 ring-sky-400/35";
            return (
                <div className={`mono rounded-2xl px-3 py-2 text-center text-sm font-semibold ring-1 ${
                    faded ? "bg-slate-950 text-slate-700 ring-slate-900 opacity-30" : active ? activeClass : "bg-slate-900 text-slate-300 ring-slate-800"
                }`}>
                    {children}
                </div>
            );
        };

        const OpeningHook = () => {
            const [size, setSize] = useState(16);
            const tasks = [
                { title: "Sorted Search", subtitle: "在有序名单里找一个学生", steps: formatLog(size), complexity: "O(log n)", note: "每次排除一半" },
                { title: "Unsorted Search", subtitle: "在乱序名单里找一个学生", steps: size, complexity: "O(n)", note: "逐个检查" },
                { title: "Every Pair Check", subtitle: "检查全班每两个人是否有冲突", steps: size * size, complexity: "O(n^2)", note: "n × n" }
            ];
            return (
                <div className="scene-enter grid gap-6 xl:grid-cols-[1.18fr_0.82fr]">
                    <Card>
                        <Eyebrow>Scene 1 · Opening Hook</Eyebrow>
                        <div className="mb-6 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
                            <div>
                                <h2 className="text-3xl font-bold text-white">先别问谁更快，先问 `n` 变大后谁会失控</h2>
                                <p className="mt-2 max-w-3xl text-sm leading-relaxed text-slate-400">复杂度不是在比较这一轮输赢，而是在比较输入规模扩大后的步骤增长方式。</p>
                            </div>
                            <Metric label="Class Size n" value={size} />
                        </div>

                        <div className="mb-6 rounded-[24px] border border-slate-800 bg-slate-950/65 px-5 py-4">
                            <div className="mb-2 text-sm font-bold text-slate-300">拖动班级人数，观察三类任务的步骤变化</div>
                            <input type="range" min="8" max="64" step="8" value={size} onChange={(e) => setSize(Number(e.target.value))} className="w-full" />
                            <div className="mt-3 flex justify-between text-xs text-slate-500">{[8,16,24,32,40,48,56,64].map((v) => <span key={v}>{v}</span>)}</div>
                        </div>

                        <div className="grid gap-4 lg:grid-cols-3">
                            {tasks.map((task) => (
                                <div key={task.title} className="rounded-[26px] border border-slate-800 bg-slate-950/70 p-5">
                                    <div className="text-lg font-bold text-white">{task.title}</div>
                                    <div className="mt-1 text-sm text-slate-400">{task.subtitle}</div>
                                    <div className="mt-4 rounded-[22px] border border-slate-800 bg-slate-900/85 p-4">
                                        <div className="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-500">Estimated Steps</div>
                                        <div className="mt-2 text-3xl font-bold text-white">{task.steps}</div>
                                        <div className="mono mt-2 text-sm text-sky-100">{task.complexity}</div>
                                        <div className="mt-2 text-sm text-slate-400">{task.note}</div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="mt-6 rounded-[24px] border border-sky-400/15 bg-sky-400/6 p-5">
                            <div className="mb-2 text-[11px] font-bold uppercase tracking-[0.28em] text-sky-200/70">Lesson Thread</div>
                            <div className="flex flex-wrap items-center gap-3 text-lg font-bold text-white">
                                <span className="rounded-full bg-slate-950/80 px-4 py-2 ring-1 ring-slate-800">动作模式</span>
                                <ArrowRight size={18} className="text-sky-300" />
                                <span className="rounded-full bg-slate-950/80 px-4 py-2 ring-1 ring-slate-800">步骤增长</span>
                                <ArrowRight size={18} className="text-sky-300" />
                                <span className="rounded-full bg-slate-950/80 px-4 py-2 ring-1 ring-slate-800">表达式</span>
                                <ArrowRight size={18} className="text-sky-300" />
                                <span className="rounded-full bg-slate-950/80 px-4 py-2 ring-1 ring-slate-800">Big-O</span>
                            </div>
                        </div>
                    </Card>

                    <TeachingPanel
                        intro="先用三类任务把学生拉到‘n 变大以后工作量会怎样’这个问题，不急着给定义。"
                        operate="拖动人数滑块，让三张任务卡同时变化，先让学生猜哪一种任务最容易失控。"
                        focus="学生要看到：不同任务对 n 的反应完全不同。"
                        line="复杂度不是说这一轮谁更快，而是在说当输入规模 n 变大时，步骤数会按什么规律增长。"
                        takeaway="先看增长，再给它贴上表达式和 Big-O。"
                    />
                </div>
            );
        };

        const SearchReplay = () => {
            const [size, setSize] = useState(32);
            const [mode, setMode] = useState("Near End");
            const [step, setStep] = useState(1);
            const [running, setRunning] = useState(false);

            const values = useMemo(() => Array.from({ length: size }, (_, index) => index + 1), [size]);
            const targetIndex = targetIndexFor(size, mode);
            const targetValue = values[targetIndex];
            const linearTotal = targetIndex + 1;
            const binaryTotal = formatLog(size);

            useEffect(() => {
                setStep(1);
                setRunning(false);
            }, [size, mode]);

            useEffect(() => {
                if (!running) return undefined;
                const maxStep = Math.max(linearTotal, binaryTotal);
                if (step >= maxStep) {
                    setRunning(false);
                    return undefined;
                }
                const timer = window.setTimeout(() => setStep((value) => value + 1), 720);
                return () => window.clearTimeout(timer);
            }, [running, step, linearTotal, binaryTotal]);

            const binaryRemaining = Math.max(1, Math.ceil(size / Math.pow(2, Math.min(step, binaryTotal))));
            return (
                <div className="scene-enter grid gap-6 xl:grid-cols-[1.22fr_0.78fr]">
                    <Card>
                        <Eyebrow>Scene 2 · Search Replay</Eyebrow>
                        <div className="mb-6 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
                            <div>
                                <h2 className="text-3xl font-bold text-white">把已学过的搜索直觉，翻译成 `log n` 和 `n`</h2>
                                <p className="mt-2 max-w-3xl text-sm leading-relaxed text-slate-400">这一幕只回收旧知：每次减半对应 `log n`，逐个扫描对应 `n`。</p>
                            </div>
                            <div className="flex flex-wrap gap-3">
                                <button onClick={() => setStep((value) => value + 1)} className="control-btn"><Sparkles size={18} />Step</button>
                                <button onClick={() => setRunning((value) => !value)} className="control-btn primary">{running ? <Pause size={18} /> : <Play size={18} />}{running ? "Pause" : "Auto Run"}</button>
                                <button onClick={() => { setRunning(false); setStep(1); }} className="control-btn"><TimerReset size={18} />Reset</button>
                            </div>
                        </div>

                        <div className="mb-6 grid gap-4 lg:grid-cols-2">
                            <div className="rounded-[24px] border border-slate-800 bg-slate-950/65 p-4">
                                <div className="mb-3 text-sm font-bold text-slate-300">Choose n</div>
                                <div className="flex flex-wrap gap-2">{SIZE_OPTIONS.map((option) => <button key={option} onClick={() => setSize(option)} className={`rounded-full px-4 py-2 text-sm font-bold ${option === size ? "bg-sky-400/20 text-sky-100 ring-1 ring-sky-400/35" : "bg-slate-900 text-slate-300 ring-1 ring-slate-800"}`}>{option}</button>)}</div>
                            </div>
                            <div className="rounded-[24px] border border-slate-800 bg-slate-950/65 p-4">
                                <div className="mb-3 text-sm font-bold text-slate-300">Target Position</div>
                                <div className="flex flex-wrap gap-2">{["Near Start","Middle","Near End"].map((option) => <button key={option} onClick={() => setMode(option)} className={`rounded-full px-4 py-2 text-sm font-bold ${option === mode ? "bg-amber-400/20 text-amber-100 ring-1 ring-amber-400/35" : "bg-slate-900 text-slate-300 ring-1 ring-slate-800"}`}>{option}</button>)}</div>
                            </div>
                        </div>

                        <div className="grid gap-4 lg:grid-cols-2">
                            <div className="rounded-[24px] border border-slate-800 bg-slate-950/72 p-5">
                                <div className="mb-4 flex items-center justify-between">
                                    <div><div className="text-lg font-bold text-white">Linear Search</div><div className="text-sm text-slate-400">check one by one</div></div>
                                    <Metric label="Current Steps" value={Math.min(step, linearTotal)} />
                                </div>
                                <div className="grid grid-cols-4 gap-2 lg:grid-cols-8">{values.map((value, index) => <ValuePill key={value} active={index === Math.min(step - 1, targetIndex)} tone="amber">{value}</ValuePill>)}</div>
                                <div className="mt-4 rounded-[22px] border border-slate-800 bg-slate-900/85 p-4"><div className="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-500">Expression</div><div className="mono mt-2 text-xl font-semibold text-white">n</div><div className="mt-1 text-sm text-slate-400">最坏情况下要扫完整个列表</div></div>
                            </div>
                            <div className="rounded-[24px] border border-slate-800 bg-slate-950/72 p-5">
                                <div className="mb-4 flex items-center justify-between">
                                    <div><div className="text-lg font-bold text-white">Binary Search</div><div className="text-sm text-slate-400">eliminate half each step</div></div>
                                    <Metric label="Remaining Candidates" value={binaryRemaining} />
                                </div>
                                <div className="grid grid-cols-4 gap-2 lg:grid-cols-8">{values.map((value, index) => <ValuePill key={value} active={index === targetIndex} faded={index >= binaryRemaining && binaryRemaining < size}>{value}</ValuePill>)}</div>
                                <div className="mt-4 rounded-[22px] border border-slate-800 bg-slate-900/85 p-4"><div className="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-500">Expression</div><div className="mono mt-2 text-xl font-semibold text-white">log n</div><div className="mt-1 text-sm text-slate-400">每轮砍掉一半候选</div></div>
                            </div>
                        </div>
                    </Card>

                    <TeachingPanel
                        intro="binary 和 linear 学生已经学过，所以这里只做‘过程 -> 表达式’的转换。"
                        operate="切换 n 和目标位置，用 Step 或 Auto Run 推进，让学生盯住 steps 和 remaining candidates。"
                        focus="学生要能说出：binary 的关键是每次减半，linear 的关键是逐个检查。"
                        line="当一个算法每次都能排除一半候选时，它的步骤增长像 log n；当它需要一项一项扫描时，它的步骤增长像 n。"
                        takeaway="Binary Search -> O(log n)，Linear Search -> O(n)。"
                    />
                </div>
            );
        };

        const PairComparisonGrid = () => {
            const [size, setSize] = useState(8);
            const [count, setCount] = useState(0);
            const [running, setRunning] = useState(false);
            const total = size * size;

            useEffect(() => {
                setCount(0);
                setRunning(false);
            }, [size]);

            useEffect(() => {
                if (!running) return undefined;
                if (count >= total) {
                    setRunning(false);
                    return undefined;
                }
                const timer = window.setTimeout(() => setCount((value) => Math.min(value + 1, total)), 45);
                return () => window.clearTimeout(timer);
            }, [running, count, total]);

            const activeIndex = count < total ? count : total - 1;
            const activeRow = Math.floor(activeIndex / size) + 1;
            const activeCol = (activeIndex % size) + 1;

            return (
                <div className="scene-enter grid gap-6 xl:grid-cols-[1.16fr_0.84fr]">
                    <Card>
                        <Eyebrow>Scene 3 · Pair Comparison Grid</Eyebrow>
                        <div className="mb-6 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
                            <div>
                                <h2 className="text-3xl font-bold text-white">用二维比较矩阵讲清 `O(n^2)`</h2>
                                <p className="mt-2 max-w-3xl text-sm leading-relaxed text-slate-400">平方复杂度不是“更慢一点的线性”，而是两层完整遍历带来的面积暴涨。</p>
                            </div>
                            <div className="flex flex-wrap gap-3">
                                <button onClick={() => setCount((value) => Math.min(value + 1, total))} className="control-btn"><Sparkles size={18} />Step</button>
                                <button onClick={() => setRunning((value) => !value)} className="control-btn primary">{running ? <Pause size={18} /> : <Play size={18} />}{running ? "Pause" : "Auto Fill"}</button>
                                <button onClick={() => { setRunning(false); setCount(0); }} className="control-btn"><RefreshCw size={18} />Reset</button>
                            </div>
                        </div>

                        <div className="mb-6 rounded-[24px] border border-slate-800 bg-slate-950/65 p-4">
                            <div className="mb-3 text-sm font-bold text-slate-300">Choose class size for pair checking</div>
                            <div className="flex flex-wrap gap-2">{GRID_SIZES.map((option) => <button key={option} onClick={() => setSize(option)} className={`rounded-full px-4 py-2 text-sm font-bold ${option === size ? "bg-emerald-400/20 text-emerald-100 ring-1 ring-emerald-400/35" : "bg-slate-900 text-slate-300 ring-1 ring-slate-800"}`}>{option} x {option}</button>)}</div>
                        </div>

                        <div className="grid gap-4 lg:grid-cols-[0.72fr_0.28fr]">
                            <div className="rounded-[24px] border border-slate-800 bg-slate-950/72 p-4">
                                <div className="mb-3 text-sm font-bold text-slate-300">Every student vs every student</div>
                                <div className="grid gap-1" style={{ gridTemplateColumns: `repeat(${size}, minmax(0, 1fr))` }}>
                                    {Array.from({ length: total }, (_, index) => {
                                        const active = count < total && index === activeIndex;
                                        const done = index < count;
                                        return <div key={index} className={`aspect-square rounded-[8px] ring-1 ${active ? "bg-emerald-300 ring-emerald-200" : done ? "bg-emerald-400/25 ring-emerald-400/20" : "bg-slate-950 ring-slate-800"}`} />;
                                    })}
                                </div>
                            </div>
                            <div className="grid gap-3">
                                <Metric label="n" value={size} />
                                <Metric label="Compared Cells" value={count} />
                                <Metric label="Total Work" value={total} note="n × n" />
                                <Metric label="Active Row / Col" value={`${activeRow} / ${activeCol}`} note="outer loop / inner loop" />
                            </div>
                        </div>

                        <div className="mt-6 grid gap-4 md:grid-cols-2">
                            <div className="rounded-[22px] border border-slate-800 bg-slate-950/75 p-4">
                                <div className="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-500">Expression</div>
                                <div className="mono mt-2 text-2xl font-semibold text-white">n^2</div>
                                <div className="mt-2 text-sm text-slate-400">两层完整遍历意味着一层跑 n 次，另一层也跑 n 次。</div>
                            </div>
                            <div className="rounded-[22px] border border-slate-800 bg-slate-950/75 p-4">
                                <div className="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-500">When n doubles</div>
                                <div className="mt-2 text-2xl font-semibold text-white">{size * size} → {(size * 2) * (size * 2)}</div>
                                <div className="mt-2 text-sm text-slate-400">n 翻倍时，工作量接近变成四倍，这就是平方增长的危险点。</div>
                            </div>
                        </div>
                    </Card>

                    <TeachingPanel
                        intro="这里专门负责 O(n^2)，一定要让学生看见面积从 n 乘 n 展开。"
                        operate="切换班级规模后再自动铺满矩阵，让学生先猜总格子数，再验证。"
                        focus="学生要把行理解为外层循环，把列理解为内层循环。"
                        line="当每个元素都要和其他所有元素比较时，常常会出现两层完整遍历，总工作量就是 n²，对应 O(n²)。"
                        takeaway="O(n²) 不是符号技巧，而是可视化出来的 n × n。"
                    />
                </div>
            );
        };

        const ComplexityTranslator = () => {
            const [selected, setSelected] = useState("log");
            const [size, setSize] = useState(16);
            const configs = {
                log: { title: "Eliminate Half Each Step", expression: "log n", complexity: "O(log n)", now: formatLog(size), doubled: formatLog(size * 2), note: "每次排除一半候选" },
                linear: { title: "Check One by One", expression: "n", complexity: "O(n)", now: size, doubled: size * 2, note: "单层遍历" },
                square: { title: "Compare Every Pair", expression: "n^2", complexity: "O(n^2)", now: size * size, doubled: (size * 2) * (size * 2), note: "两层完整遍历" }
            };
            const item = configs[selected];

            return (
                <div className="scene-enter grid gap-6 xl:grid-cols-[1.18fr_0.82fr]">
                    <Card>
                        <Eyebrow>Scene 4 · Complexity Translator</Eyebrow>
                        <div className="mb-6">
                            <h2 className="text-3xl font-bold text-white">动作 -> 表达式 -> Big-O</h2>
                            <p className="mt-2 max-w-3xl text-sm leading-relaxed text-slate-400">这一步要求学生不只看懂动画，还要会把动作模式翻译成复杂度语言。</p>
                        </div>

                        <div className="mb-6 rounded-[24px] border border-slate-800 bg-slate-950/65 p-4">
                            <div className="mb-2 text-sm font-bold text-slate-300">Set input size n</div>
                            <input type="range" min="8" max="64" step="8" value={size} onChange={(e) => setSize(Number(e.target.value))} className="w-full" />
                        </div>

                        <div className="mb-6 grid gap-4 lg:grid-cols-3">
                            {Object.entries(configs).map(([key, config]) => (
                                <button key={key} onClick={() => setSelected(key)} className={`rounded-[24px] border p-5 text-left ${selected === key ? "border-sky-400/30 bg-sky-400/10" : "border-slate-800 bg-slate-950/70"}`}>
                                    <div className="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-500">Pattern</div>
                                    <div className="mt-2 text-lg font-bold text-white">{config.title}</div>
                                    <div className="mt-2 text-sm text-slate-400">{config.note}</div>
                                </button>
                            ))}
                        </div>

                        <div className="grid gap-4 lg:grid-cols-[0.64fr_0.36fr]">
                            <div className="rounded-[24px] border border-slate-800 bg-slate-950/72 p-5">
                                <div className="space-y-3">
                                    <div className="rounded-[22px] border border-slate-800 bg-slate-900/80 p-4"><div className="text-sm font-bold text-slate-300">1. Pattern</div><div className="mt-2 text-xl font-bold text-white">{item.title}</div></div>
                                    <div className="flex justify-center text-slate-500"><ArrowRight size={18} /></div>
                                    <div className="rounded-[22px] border border-slate-800 bg-slate-900/80 p-4"><div className="text-sm font-bold text-slate-300">2. Expression</div><div className="mono mt-2 text-2xl font-semibold text-white">{item.expression}</div></div>
                                    <div className="flex justify-center text-slate-500"><ArrowRight size={18} /></div>
                                    <div className="rounded-[22px] border border-slate-800 bg-slate-900/80 p-4"><div className="text-sm font-bold text-slate-300">3. Big-O</div><div className="mono mt-2 text-2xl font-semibold text-white">{item.complexity}</div></div>
                                </div>
                            </div>
                            <div className="grid gap-3">
                                <Metric label="Current Steps" value={item.now} />
                                <Metric label="If n Doubles" value={item.doubled} />
                                <Metric label="n -> 2n" value={`${size} -> ${size * 2}`} note="compare workload growth" />
                            </div>
                        </div>
                    </Card>

                    <TeachingPanel
                        intro="这是整节课的表达训练，要把‘看懂’推进到‘会写’。"
                        operate="依次点击三种模式卡，让学生先说表达式，再说 Big-O，然后拖动 n 看翻倍效果。"
                        focus="学生要形成‘pattern first’的习惯：先识别动作模式，再写表达式。"
                        line="Big-O 不是精确计步器，而是描述增长级别的表达方式。不同表达式代表不同的增长速度。"
                        takeaway="先识别 pattern，再写 expression，最后写 Big-O。"
                    />
                </div>
            );
        };

        const FinalSummary = () => (
            <div className="scene-enter grid gap-6 xl:grid-cols-[1.15fr_0.85fr]">
                <Card>
                    <Eyebrow>Scene 5 · Final Summary</Eyebrow>
                    <div className="mb-6">
                        <h2 className="text-3xl font-bold text-white">From Steps to Big-O</h2>
                        <p className="mt-2 max-w-3xl text-sm leading-relaxed text-slate-400">最后一幕像结课板书，把三种复杂度并排收束，方便直接做口头总结。</p>
                    </div>

                    <div className="grid gap-4 lg:grid-cols-3">
                        <div className="rounded-[24px] border border-slate-800 bg-slate-950/72 p-5"><div className="mono text-2xl font-semibold text-sky-100">O(log n)</div><div className="mt-3 text-sm text-slate-400">Binary Search</div><div className="mt-2 text-sm text-slate-500">eliminate half each step</div></div>
                        <div className="rounded-[24px] border border-slate-800 bg-slate-950/72 p-5"><div className="mono text-2xl font-semibold text-amber-100">O(n)</div><div className="mt-3 text-sm text-slate-400">Linear Search</div><div className="mt-2 text-sm text-slate-500">check one by one</div></div>
                        <div className="rounded-[24px] border border-slate-800 bg-slate-950/72 p-5"><div className="mono text-2xl font-semibold text-emerald-100">O(n^2)</div><div className="mt-3 text-sm text-slate-400">pair comparison / nested loops</div><div className="mt-2 text-sm text-slate-500">n times n</div></div>
                    </div>

                    <div className="mt-6 grid gap-4 md:grid-cols-2">
                        <div className="rounded-[22px] border border-slate-800 bg-slate-950/75 p-4"><div className="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-500">Core Definition</div><div className="mt-3 text-lg font-bold text-white">Big-O describes how the number of steps grows as input size increases.</div></div>
                        <div className="rounded-[22px] border border-slate-800 bg-slate-950/75 p-4"><div className="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-500">When n doubles</div><div className="mt-3 text-sm leading-relaxed text-slate-300">`O(log n)` 上升一点，`O(n)` 大约翻倍，`O(n^2)` 接近变成四倍。</div></div>
                    </div>

                    <div className="mt-6 rounded-[22px] border border-slate-800 bg-slate-950/75 p-4">
                        <div className="mb-3 text-sm font-bold text-white">Exit Ticket</div>
                        <div className="space-y-3 text-sm text-slate-300">
                            <div>1. Why is Binary Search an example of <span className="mono text-sky-100">O(log n)</span>?</div>
                            <div>2. Why is Linear Search an example of <span className="mono text-amber-100">O(n)</span>?</div>
                            <div>3. What kind of process often creates <span className="mono text-emerald-100">O(n^2)</span>?</div>
                        </div>
                    </div>
                </Card>

                <TeachingPanel
                    intro="最后一幕只做收束，不再开新分支。"
                    operate="依次指向三栏，请学生分别说出：例子、动作模式、Big-O。最后再完成 Exit Ticket。"
                    focus="学生要能从例子回到模式，再从模式回到 Big-O。"
                    line="复杂度不是背符号，而是用来描述步骤随输入规模变化方式的语言。"
                    takeaway="看见动作模式，就应该能逐步翻译到 Big-O。"
                />
            </div>
        );

        const scenes = [
            { title: "Opening Hook", subtitle: "先让学生看见不同任务对 n 的反应", objective: "把‘谁更快’升级成‘n 变大后步骤如何增长’", component: <OpeningHook /> },
            { title: "Search Replay", subtitle: "回收 O(log n) 与 O(n)", objective: "把已学过的搜索直觉翻译成表达式", component: <SearchReplay /> },
            { title: "Pair Comparison Grid", subtitle: "用比较矩阵讲清 O(n^2)", objective: "让学生真正看见 n × n 从哪里来", component: <PairComparisonGrid /> },
            { title: "Complexity Translator", subtitle: "动作 -> 表达式 -> Big-O", objective: "把观察稳定转换成复杂度表达", component: <ComplexityTranslator /> },
            { title: "Final Summary", subtitle: "三种复杂度并排收束", objective: "形成可直接口头输出的结论", component: <FinalSummary /> }
        ];

        const App = () => {
            const [sceneIndex, setSceneIndex] = useState(0);
            const scene = scenes[sceneIndex];
            return (
                <div className="flex h-screen flex-col overflow-hidden">
                    <header className="glass border-b border-slate-800/90 px-5 py-4 md:px-8">
                        <div className="flex flex-col gap-5 xl:flex-row xl:items-end xl:justify-between">
                            <div className="flex items-start gap-4">
                                <div className="rounded-[24px] bg-slate-950/80 p-4 ring-1 ring-slate-800"><Layers3 size={28} className="text-sky-300" /></div>
                                <div>
                                    <div className="text-[11px] font-bold uppercase tracking-[0.28em] text-slate-500">AP CSP Teaching Demo</div>
                                    <h1 className="mt-2 text-3xl font-bold tracking-tight text-white">Complexity Studio</h1>
                                    <p className="mt-2 max-w-2xl text-sm leading-relaxed text-slate-400">从步骤数到 Big-O：讲清楚 <span className="mono">O(log n)</span>、<span className="mono">O(n)</span>、<span className="mono">O(n^2)</span>。</p>
                                </div>
                            </div>
                            <div className="rounded-[24px] border border-slate-800 bg-slate-950/75 px-4 py-4">
                                <div className="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-500">Current Objective</div>
                                <div className="mt-2 max-w-xl text-sm text-slate-300">{scene.objective}</div>
                            </div>
                        </div>
                        <div className="mt-5 flex flex-wrap gap-2">
                            {scenes.map((item, index) => <button key={item.title} onClick={() => setSceneIndex(index)} className={`rounded-full px-4 py-2 text-xs font-bold ${sceneIndex === index ? "bg-sky-400/16 text-sky-100 ring-1 ring-sky-400/35" : "bg-slate-950/70 text-slate-400 ring-1 ring-slate-800"}`}>{index + 1}. {item.title}</button>)}
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto px-4 py-5 md:px-6 xl:px-8">
                        <div className="mx-auto w-full max-w-[1500px]">
                            <div className="mb-5 rounded-[28px] border border-slate-800 bg-slate-950/55 px-5 py-4">
                                <div className="text-[11px] font-bold uppercase tracking-[0.28em] text-slate-500">Current Scene</div>
                                <div className="mt-2 text-2xl font-bold text-white">{scene.title}</div>
                                <div className="mt-1 text-sm text-slate-400">{scene.subtitle}</div>
                            </div>
                            {scene.component}
                        </div>
                    </main>

                    <footer className="glass border-t border-slate-800/90 px-5 py-4 md:px-8">
                        <div className="flex items-center justify-between gap-4">
                            <button onClick={() => setSceneIndex((value) => Math.max(0, value - 1))} disabled={sceneIndex === 0} className="control-btn"><ChevronLeft size={18} />Previous</button>
                            <div className="hidden items-center gap-2 md:flex">{scenes.map((item, index) => <div key={item.title} className={`h-2 rounded-full ${sceneIndex === index ? "w-12 bg-sky-300" : index < sceneIndex ? "w-7 bg-slate-600" : "w-7 bg-slate-800"}`} />)}</div>
                            <button onClick={() => setSceneIndex((value) => Math.min(scenes.length - 1, value + 1))} disabled={sceneIndex === scenes.length - 1} className="control-btn primary">Next<ChevronRight size={18} /></button>
                        </div>
                    </footer>
                </div>
            );
        };

        createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
